  - "median_flips"
prereg_delta_k_s: [1.0, 3.0]

statistics:
  unit_of_analysis: "源视频簇（source video cluster）"
  audit_split: "test"
  r0: 0.9
  bootstrap_n: 1000
  bootstrap_seed: 20260903
  alpha_pairs: 0.05
  paired_test: "cluster-level paired bootstrap"
  p_method: "normal"                 # A5
  multiple_comparison: "Holm"
  mrd_quantile: 0.95
  ruler_definition: >
    median |M(a) - M(b)| over the window-end-tied system pairs at pi0, in this metric's
    own units; the smallest difference this study treats as worth reporting for M.
  unit_caveat: >
    簇是「同一源视频」而不是「同一类事故」。manifest v2 全部 1789 个簇中有 54 个含多于一种
    碰撞类型（2 类 37、3 类 15、4 类 2）；按划分 train 31 / dev 6 / test 17；
    按合格集合 H=4.0 档 29 个（其中恰含 2 类的 21 个）、H=10.0 档 1 个、H=21.5 档 0 个。
    簇只承担统计独立性，不承担类别同质性。

