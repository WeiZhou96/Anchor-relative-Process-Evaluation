  version: v6
  protocol_version: 1.0-S1-2026-09-03
  frozen: true
  frozen_by: "authors"
  frozen_at_utc: "2026-09-09"
  supersedes: v5
  supersedes_file: prereg/S1_freeze_2026-09-09_v5.yaml
