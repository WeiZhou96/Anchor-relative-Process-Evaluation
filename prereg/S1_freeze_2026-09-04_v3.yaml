system_library_r2:
  seeds:
  - 20260903
  - 20260904
  - 20260905
  backbones:
    r18:
      source: existing ImageNet pretrained ResNet-18 cache
      features_dir: outputs/features
      dim: 512
    clipb16:
      source: openai/clip-vit-base-patch16
      feature: CLIP projected image features, L2-normalized, frozen encoder
      features_dir: outputs/features/clip_b16
      dim: 512
      fallback: only if CLIP download/load fails after one serial retry, use pretrained
        torchvision ResNet-50, 2048-d, explicit r50 IDs/cards; no random fallback
  frame_grid: 4 fps; each new npz must have exactly the existing r18 t_s and frame
    count; no new frame grid
  trained_classifier_rules:
  - mean_linear
  - gru128
  - gru512
  base_id_template: r2__{backbone}__{mean|gru128|gru512}__seed{seed}
  base_instances: 18
  class_balancing: CE weights N_train/(5*n_train_class); GRU first averages supervised
    losses within each clip, then takes class-weighted clip mean; mean classifier
    uses one weighted CE per clip
  time_augmentation:
    training_only: true
    prefix_start_jitter_seconds:
    - 0.0
    - 1.0
    rule: uniform start jitter capped at the anchor and last available pre-anchor
      frame; never shift timestamps; Bernoulli frame dropout 0.10; retain the last
      available frame and at least one post-anchor frame if present
    frame_dropout_probability: 0.1
    evaluation_augmentation: false
  optimization:
    optimizer: Adam
    weight_decay: 0.0001
    mean_learning_rates:
    - 0.001
    - 0.01
    gru_learning_rates:
    - 0.0003
    - 0.001
    mean_max_epochs: 200
    mean_patience: 30
    gru_max_epochs: 60
    gru_patience: 10
    batch_size: 32
    gradient_norm_clip: 5.0
    train_normalization: train-only mean/std; mean-head statistics from whole-clip
      means, GRU statistics from train frames through anchor+22s
    gru_train_cap_seconds_after_anchor: 22.0
    early_stop_and_lr_selection: max dev window-end macro-Acc at frozen H=10, eligible
      L+ + 1e-9 >= 10; ties choose earlier epoch then first listed lr; all 102 dev
      clips retained for trajectory generation
    unselected_candidates: training history stored; no test inference or test metrics
  postproc:
    parents: new gru512 for both backbones, each seed (v2 parent scope retained)
    arms_by_rule:
    - ema
    - majority
    - hysteresis
    - patience
    grids:
      ema:
      - 0.2
      - 0.35
      - 0.5
      - 0.7
      majority:
      - 2
      - 3
      - 5
      - 7
      - 9
      hysteresis:
      - 0.05
      - 0.1
      - 0.2
      - 0.3
      patience:
      - 2
      - 3
      - 4
      - 6
    selection: per parent and seed, dev H=10 minimum RMSCD subject to endpoint macro-Acc
      >= parent; if none feasible, minimum RMSCD and explicitly mark violation; ties
      first listed candidate
  commit_existing:
    parents: new gru512 for both backbones, each seed
    arms_by_rule:
    - commit_msp
    - commit_margin
    threshold_sweep: true
    msp_thresholds:
    - 0.5
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    margin_thresholds:
    - 0.1
    - 0.2
    - 0.4
    - 0.6
    note: v2 freezes a threshold sweep, not one selected threshold; retain every threshold
      with separate dev readout, never choose using test
  commit_published:
    parents: both new gru128 and gru512, both backbones, each seed (12 parents)
    ringel2024:
      arm_rule: ringel2024_conditional_adapt
      paper: https://arxiv.org/html/2402.00857v1
      official_code: https://github.com/liranringel/etc/blob/master/conditional_calibration.py
      core: MSP first crossing of a time-dependent threshold; forward candidate screening
        of accumulated positive accuracy gap; reverse fixed-sequence binomial testing
        over accumulated halt times
      accuracy_gap_alpha: 0.1
      testing_delta: 0.05
      lambda_grid_step: 0.05
      development_split: eligible dev source clusters sorted then shuffled by parent
        seed; first floor(n_clusters/2) screening, remaining testing; no five-fold
        cross-fitting
      reference_endpoint_seconds: 10.0
      force_stop_at_fixed_reference_endpoint: true
      fallback: retain infinity for every unaccepted threshold; forced stop at absolute
        anchor+10 remains
      deviations: fixed anchor-relative 10s endpoint replaces full sequence endpoint;
        MSP replaces optional learned correctness estimator; input is fixed GRU posterior
        trajectory; finite dev reuse for epoch selection and within-cluster dependence
        invalidate original iid holdout guarantee, so this is a reproducible adaptation
        with no claimed finite-sample guarantee; all thresholds after 10s are irrelevant
        because commitment is irreversible
    teaser:
      arm_rule: teaser_ocsvm_adapt
      paper: https://doi.org/10.1007/s10618-020-00690-z
      core: snapshot-specific one-class RBF SVM trained on correct train predictions,
        feature vector [predicted class, five probabilities, top1-top2 margin], commit
        after v consecutive reliable identical labels
      ocsvm_nu: 0.05
      gamma_grid:
      - 1.0
      - 10.0
      - 100.0
      v_grid:
      - 1
      - 2
      - 3
      - 4
      - 5
      fit_data: only train, correct and observed post-anchor snapshots, minimum 2
        examples; otherwise reliability always false
      selection: per parent and seed dev H=10 maximize harmonic mean of window-end
        macro-Acc and 1 - mean censored halt time/10; never-committed labels count
        wrong; ties first gamma then first v
      deviations: GRU posterior slave replaces WEASEL; smaller preregistered gamma
        grid; selection on fixed dev rather than train CV; absolute seconds replace
        fraction of unknown full length; no forced stop at clip end, never-committed
        remain BOT; no accuracy/coverage guarantee
  fine_system_instances: 120
  coarse_regenerated_instances: 204
  total_answer_directories: 324
  stride_reruns:
    strides:
    - 2
    - 4
    base_classifiers: subsample equivalence verified on dev using explicit prefix
      recomputation; no extra base directories
    postproc_and_all_commit_rules: rerun on subsampled base trajectories, preserve
      fine-selected parameters and rule; Ringel threshold and TEASER snapshot classifier
      indexed by absolute delta, persistence counts run on the coarse grid; add __stride2
      or __stride4
  vlm: excluded; owned by D, no VLM in this registration
test_access:
  policy: all training and every arm selection completed and sealed before test inference;
    infer each selected base once over test; no test labels consumed for generation;
    after all answers pass structural checks, a single final endpoint-only evaluation
    batch computes H=10 macro-Acc once per delivered new directory (fine and coarse);
    no other new test metrics
  manifest_labels: manifest necessarily contains labels; training/selection routines
    receive train/dev views only; final evaluator alone uses test labels
  guard: exclusive final evaluation ledger; rerun reads stored results and never recomputes
    completed test rows
reproducibility:
  gpu: CUDA_VISIBLE_DEVICES=0
  hf_home: /home/ps/weizhou/tmp/hf_cache/
  no_dependency_version_changes: true
  long_jobs: nohup with PID and logs
  old_outputs: read-only reuse; only r2__* answer/checkpoint outputs added
