discipline:
  - "冻结后任何改动须新建版本文件并在论文声明，禁止就地覆盖本文件"
  - "S1 之后不回改协议；要改则全部重跑并说明哪些结果来自旧版本"
  - "冻结前的一切查看只在开发子集，审计集永不参与"
