# Environment used for all ACCIDENT computations (Linux, Python 3.11.14).
# Versions are those installed when the results were produced; only packages that the code imports are listed.
# CPU-only steps (evaluation, audit, re-analyses, calibration, figures) run with the same environment;
# CUDA is used only for feature extraction, system training, the VLM run and the stage-two training comparison.
# The MM-AU model runs used a separate environment: see mmau/requirements-training.txt.
name: ape
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11.14
  - numpy=2.0.1
  - pandas=3.0.0
  - scipy=1.16.0
  - scikit-learn=1.8.0
  - matplotlib=3.10.8
  - pyyaml=6.0.3
  - joblib=1.5.3
  - pillow=12.1.1
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - torchvision=0.20.1
  - pip
  - pip:
      - pyarrow==23.0.1
      - pytest==9.1.1
      - ImageHash==4.3.2
      - opencv-python==4.13.0.92
      - transformers==5.2.0
      - accelerate==1.12.0
      - huggingface_hub==1.5.0
      - tokenizers==0.22.2
      - safetensors==0.7.0
